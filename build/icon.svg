<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="140" x2="860" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.55" stop-color="#F1641E"/>
      <stop offset="1" stop-color="#DC4F0A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="300" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#7d2c00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- squircle 底 -->
  <g filter="url(#soft)">
    <rect x="100" y="100" width="824" height="824" rx="188" ry="188" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="188" ry="188" fill="url(#gloss)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="187.5" ry="187.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- 背景淡网格线 -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="3">
    <line x1="250" y1="410" x2="774" y2="410"/>
    <line x1="250" y1="540" x2="774" y2="540"/>
    <line x1="250" y1="670" x2="774" y2="670"/>
  </g>

  <!-- 折线下方填充 -->
  <path d="M250 672 L372 590 L494 632 L616 476 L762 336 L762 760 L250 760 Z" fill="url(#area)"/>

  <!-- 趋势折线 -->
  <path d="M250 672 L372 590 L494 632 L616 476 L762 336"
        fill="none" stroke="#ffffff" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据点 -->
  <g fill="#ffffff">
    <circle cx="372" cy="590" r="20"/>
    <circle cx="494" cy="632" r="20"/>
    <circle cx="616" cy="476" r="20"/>
  </g>
  <!-- 起点/终点强调 -->
  <circle cx="250" cy="672" r="22" fill="#ffffff"/>
  <circle cx="762" cy="336" r="40" fill="#ffffff"/>
  <circle cx="762" cy="336" r="18" fill="#F1641E"/>

  <!-- AI 星芒 -->
  <g transform="translate(786 250)" fill="#ffffff">
    <path d="M0 -46 C6 -14 14 -6 46 0 C14 6 6 14 0 46 C-6 14 -14 6 -46 0 C-14 -6 -6 -14 0 -46 Z"/>
  </g>
  <g transform="translate(700 214)" fill="#ffffff" fill-opacity="0.9">
    <path d="M0 -20 C2.6 -6 6 -2.6 20 0 C6 2.6 2.6 6 0 20 C-2.6 6 -6 2.6 -20 0 C-6 -2.6 -2.6 -6 0 -20 Z"/>
  </g>
</svg>
